name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Сервер асаж /health хариулж байгааг шалгана — import-ын алдаа (буруу зам, байхгүй export)
      # Render дээр deploy хийхээс өмнө баригдана. DB шаардлагагүй: холболт амжилтгүй болсон ч сервер асна.
      - name: Smoke test
        env:
          PORT: 4000
        run: |
          node server.js &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:4000/health && exit 0
            sleep 1
          done
          echo "Server did not respond on /health" >&2
          exit 1
