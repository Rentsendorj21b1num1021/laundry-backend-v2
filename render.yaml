# Render Blueprint — https://render.com/docs/blueprint-spec
# Render dashboard → New → Blueprint → энэ repo-г сонгоход доорх сервисийг үүсгэнэ.
services:
  - name: laundry-backend
    type: web
    runtime: node
    plan: free
    # MongoDB Atlas-тай ижил region
    region: singapore
    branch: main
    # GitHub Actions-ийн CI (lint, smoke test) амжилттай болсны дараа л deploy хийнэ.
    autoDeployTrigger: checksPass
    # Build алхам байхгүй (plain JS) — зөвхөн production dependency суулгана.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Нууц утгууд: Blueprint үүсгэх үед Render асууна, git-д хадгалахгүй.
      # MONGO_URL: prod MongoDB Atlas connection string
      - key: MONGO_URL
        sync: false
      # Одоо ажиллаж буй орчны JWT_SECRET-ийг оруулбал хэрэглэгчдийн токен хүчинтэй хэвээр үлдэнэ.
      - key: JWT_SECRET
        sync: false
